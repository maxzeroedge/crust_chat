[package]
name = "cli_chat"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = "0.4.43"
mime_guess = "2.0.5"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thirtyfour = "0.36.1"
tokio = { version = "1.49.0", features = ["full"] }
log = "0.4.29"
simple_logger = "5.1.0"
anyhow = "1.0.101"
adk-model = { version = "0.2.1", features = ["ollama", "anthropic"] }
adk-rust = "0.2.1"
dotenvy = "0.15.7"
adk-agent = "0.2.1"
extractous = "0.3.0"
schemars = "1.2.1"
rig-core = "0.30.0"
clap = "4.5.58"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"] }
pgvector = { version = "0.4", features = ["sqlx"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
neo4rs = "0.8"
tempfile = "3"
ctrlc = "3"
